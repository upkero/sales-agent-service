name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Builds and deploys the chosen branch. For the owner only (see `if:` below):
  # it exists to test a rollback from a throwaway branch, main deploys on push.
  workflow_dispatch:

permissions:
  contents: read

# One run at a time per branch. On main a newer push waits for the running one
# instead of cancelling it, so deploys land in push order and none stops halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE: ghcr.io/upkero/sales-agent-service

jobs:
  quality:
    runs-on: ubuntu-24.04

    # No services: this repo owns no database. Its only data sources are
    # ops-core-api and an LLM over HTTP, both replaced by in-memory fakes in the
    # tests, so the whole suite runs offline.
    env:
      # Settings are read at import time, and a required key with no value would
      # fail collection before any test runs. Throwaway CI values.
      OPS_CORE_API_KEY: ci-placeholder-key-not-a-secret
      LLM_MODEL: ci-stub-model

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src

      - name: Test
        run: uv run pytest --cov=src/app/services --cov-report=term-missing --cov-fail-under=60

  image:
    needs: quality
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.triggering_actor == 'upkero')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :main moves only on main; a branch build is reachable by its sha alone.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:main', env.IMAGE) || '' }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 30
    steps:
      # The key's forced command on the server accepts "<service> <sha>" and nothing
      # else; the server pulls the image, waits for it to turn healthy, or rolls back.
      - name: Deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "deploy@$DEPLOY_HOST" "sales-agent-service $GITHUB_SHA"
