services:
  # Named after the repository, not "api": the portfolio runs five of these side
  # by side, and three of them used to call their service "api" — a collision the
  # day any of them share a network.
  sales-agent-service:
    build: .
    env_file: .env
    environment:
      # This repo owns no database. Its two data sources both live outside this
      # compose file, so they are reached over the host, not a compose network:
      #   - ops-core-api runs from its own compose file (the price list),
      #   - the LLM is a local Ollama or a hosted provider.
      # host.docker.internal is the host as seen from a container on Docker
      # Desktop; on plain Linux the extra_hosts line below makes it resolve too.
      OPS_CORE_BASE_URL: ${OPS_CORE_BASE_URL:-http://host.docker.internal:8000}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Host 8002: the portfolio's port map is ops-core-api 8000, rag 8001,
      # sales 8002, mcp 8003, voice 8080, so all five come up together.
      - "8002:8000"
